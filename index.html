<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeeQueen</title>

    <!-- Copy your assets folder as-is -->
    <link data-trunk rel="copy-dir" href="assets" />

    <!-- Just include the already-built CSS -->
    <link data-trunk rel="css" href="src/output.css" data-integrity="none" />

    <!-- Let Trunk build your Rust app -->
    <link data-trunk rel="rust" href="Cargo.toml" data-integrity="none" />
  </head>
  <body>
    <div id="root"></div>

    <!-- If flowbite.js lives under assets, the copy-dir above will make it available at assets/flowbite.js -->
    <script src="assets/flowbite.js"></script>
  </body>
</html>
